# .claude/ is generated output: APM installs dependency-provided skills, agents and
# hook scripts there from apm.yml. It is vendored code this repository does not author,
# so linting it would report on someone else's style choices and block commits here.
exclude: '^\.claude/'

repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.3.4
    hooks:
      - id: pylint
        language_version: python3.11